version: 0.2

phases:
  install:
    commands:
      - echo "INSTALL - AWS CLI is provided by the CodeBuild image"
      - aws --version
  pre_build:
    commands:
      - echo "PRE_BUILD - launching the producer task"
      - TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER_NAME" --task-definition "$PRODUCER_TASK_DEFINITION" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=$ASSIGN_PUBLIC_IP}" --query 'tasks[0].taskArn' --output text)
      - test "$TASK_ARN" != "None"
  build:
    commands:
      - echo "BUILD - waiting only until ECS reports the producer task as running"
      - aws ecs wait tasks-running --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN"
      - STATUS=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN" --query 'tasks[0].lastStatus' --output text)
      - test "$STATUS" = "RUNNING"
  post_build:
    commands:
      - echo "POST_BUILD - producer is running independently as $TASK_ARN"
